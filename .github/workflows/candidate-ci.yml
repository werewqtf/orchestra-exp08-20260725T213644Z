name: exp08-candidate
on:
  pull_request:
permissions:
  contents: read
jobs:
  candidate-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Run deterministic verifier
        run: bash ci/verify.sh
      - name: Build exact-revision receipt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          artifact_sha=$(sha256sum dist/result.txt | awk '{print $1}')
          jq -n --arg repository "$REPO" --arg candidate_sha "$HEAD_SHA" --arg run_id "$RUN_ID" --arg artifact_sha256 "$artifact_sha" \
            '{repository:$repository,candidate_sha:$candidate_sha,workflow_run_id:($run_id|tonumber),artifact_path:"dist/result.txt",artifact_sha256:$artifact_sha256}' \
            > evidence/verifier_receipt.json
          cp dist/result.txt evidence/result.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exp08-verifier-receipt
          path: evidence/
          if-no-files-found: error
          retention-days: 7
  no-deploy-proof:
    needs: candidate-ci
    runs-on: ubuntu-latest
    environment: exp08-no-deploy
    permissions: {}
    steps:
      - run: echo "No production deployment performed"
